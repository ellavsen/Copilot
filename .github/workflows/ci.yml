name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        # Core + dev only. The [rag] extra pulls torch (~2 GB) and nothing in
        # the test suite needs it: the knowledge base degrades gracefully when
        # it is absent, and there is a test that asserts exactly that.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Ruff (format)
        run: ruff format --check src tests

      - name: Tests
        # No OPENAI_API_KEY and no BOT_TOKEN on purpose: the suite must not
        # need credentials or network access.
        run: pytest -q

  smoke:
    name: End-to-end smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - name: Database initialises and the catalogue loads
        run: indlab-seed
