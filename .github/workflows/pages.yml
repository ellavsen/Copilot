name: Deploy demo to GitHub Pages

# Publishes web/ — a self-contained page with no build step and no secrets.
#
# One-time setup: Settings → Pages → Source: GitHub Actions.
# The action's `enablement: true` option cannot do this for you — the default
# GITHUB_TOKEN is not allowed to create a Pages site and the run fails with
# "Resource not accessible by integration".

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
