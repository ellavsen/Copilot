[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indlab-copilot"
version = "0.2.0"
description = "An agentic AI copilot for visual artists: portfolio analysis, marketing strategy, promotion plan and open-call monitoring, delivered over Telegram."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "IND-LAB Copilot contributors" }]
keywords = ["ai-agents", "langgraph", "rag", "telegram-bot", "art", "marketing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Artistic Software",
]

# Core runtime: everything except the heavy embedding stack.
# Installs in seconds and is enough to run the bot, the agents and the tests.
dependencies = [
    "python-telegram-bot==22.1",
    "langgraph>=0.3,<0.7",
    "langgraph-supervisor>=0.0.27",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3.60",
    "langchain-openai>=0.3",
    "openai>=1.84",
    "pydantic>=2.11",
    "pydantic-settings>=2.9",
    # asyncio extra pulls in greenlet, which SQLAlchemy's async engine requires.
    "SQLAlchemy[asyncio]>=2.0.41",
    "aiosqlite>=0.20",
    "python-dotenv>=1.1",
]

[project.optional-dependencies]
# Local semantic search over an art-theory corpus.
# Pulls torch + transformers (~2 GB). Everything else works without it.
rag = [
    "faiss-cpu>=1.11",
    "sentence-transformers>=4.1",
    "langchain-community>=0.3.25",
    "langchain-huggingface>=0.3",
    "langchain-text-splitters>=0.3.8",
]
# Document parsing for the corpus ingester.
ingest = [
    "PyMuPDF>=1.26",
    "python-docx>=1.1",
    "tqdm>=4.66",
]
# Optional Google Drive source for the corpus ingester.
gdrive = [
    "google-api-python-client>=2.172",
    "google-auth>=2.40",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/ellavsen/Copilot"
Demo = "https://ellavsen.github.io/Copilot/"

[project.scripts]
indlab-bot = "indlab.cli:run_bot"
indlab-ingest = "indlab.cli:run_ingest"
indlab-seed = "indlab.cli:run_seed"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
indlab = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = [
    "B008",   # tool decorators legitimately call functions in defaults
    "RUF001", # Cyrillic text in strings is intentional
    "RUF002",
    "RUF003",
]
